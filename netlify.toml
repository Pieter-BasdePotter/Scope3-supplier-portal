[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[functions]
  directory    = "../netlify/functions"
  node_bundler = "esbuild"

# API calls are proxied to the Netlify Function (must come before the SPA catch-all)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# SPA catch-all: every other path serves index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
